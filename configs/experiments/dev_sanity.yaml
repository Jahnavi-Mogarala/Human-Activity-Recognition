model: bilstm_attention

# Data split paths (generated by prepare_dataset.py)
train_path: data/processed/UCI_HAR/UCI-HAR_train.npz
val_path:   data/processed/UCI_HAR/UCI-HAR_val.npz
test_path:  data/processed/UCI_HAR/UCI-HAR_test.npz

num_classes: 6

# Training hyper‑parameters (configurable)
epochs: 2
batch_size: 64
learning_rate: 0.001

# Model architecture parameters
hidden_size: 128
num_layers: 2
dropout: 0.3
attention_dim: 64

# Misc
seed: 42
early_stopping_patience: 10
lr_scheduler_patience: 5
lr_scheduler_factor: 0.5
